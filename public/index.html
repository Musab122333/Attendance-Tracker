<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📚 Attendance Tracker</h1>
            <p class="subtitle">Track your college attendance effortlessly</p>
        </header>

        <div class="stats-overview" id="statsOverview">
            <div class="stat-card">
                <div class="stat-value" id="overallPercentage">--</div>
                <div class="stat-label">Overall %</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSubjects">--</div>
                <div class="stat-label">Subjects</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="belowTarget">--</div>
                <div class="stat-label">Below 75%</div>
            </div>
            </header>

            <div class="actions">
                <button class="btn btn-secondary" onclick="loadAttendance()">
                    📊 Refresh Data
                </button>
            </div>

            <div class="update-note">
                💡 To update attendance: Run <code>UPDATE_ATTENDANCE.bat</code> on your computer, then refresh this
                page.
            </div>

            <div class="last-updated" id="lastUpdated">
                Last updated: --
            </div>

            <div id="loadingState" class="loading-state">
                <div class="spinner-large"></div>
                <p>Loading attendance data...</p>
            </div>

            <div id="errorState" class="error-state" style="display: none;">
                <p>❌ Failed to load data. Please try again.</p>
                <button class="btn btn-secondary" onclick="loadAttendance()">Retry</button>
            </div>

            <div id="subjectsContainer" class="subjects-grid">
                <!-- Subject cards will be dynamically inserted here -->
            </div>
        </div>

        <script src="js/config.js"></script>
        <script src="js/app.js"></script>
</body>

</html>
